name: Create tag for release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit hash'
        required: true
        type: string
jobs:
  create-tag:
    if: >-
      (inputs.commit || false) ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'github-actions' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
       startsWith(github.event.pull_request.head.ref, 'bump-version') )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Compute the commit
        run: |
          if [[ -z "${INPUTS_COMMIT}" ]]; then
            COMMIT=$(git rev-parse ${GH_SHA}^@ | grep -Fvx ${GH_PR_HEAD_SHA})
          else
            COMMIT="${INPUTS_COMMIT}"
          fi
          echo "commit=$COMMIT" >> $GITHUB_ENV
        env:
          GH_SHA: ${{ github.sha }}
          GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }})
          INPUTS_COMMIT: ${{ inputs.commit }}

      - name: Install rust toolchain
        run: rustup install ${TOOLCHAIN} && rustup default ${TOOLCHAIN}
        env:
          TOOLCHAIN: stable

      - name: Extract version
        run: |
          echo "version=$(cargo pkgid -p bindgen | cut -d '#' -f 2)" >> $GITHUB_ENV
 
      - name: Create tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ env.commit }} 
          custom_tag: ${{ env.version }}
