# This is triggered after a tag is pushed
# Combining trusted publishing with cargo-dist is non-trivial, so we run the crates.io
# and the GitHub release workflow in parallel
name: Publish on crates.io
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # Required for trusted publishing OIDC
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish bindgen (lib)
        run: cargo publish --package bindgen --package bindgen-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
